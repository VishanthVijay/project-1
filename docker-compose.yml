version: '3.8'

services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: habit_tracker_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: habit_tracker
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # FastAPI Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: habit_tracker_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=habit_tracker
      - SECRET_KEY=production_jwt_secret_key_change_me
    depends_on:
      - db

  # React Frontend Web Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: habit_tracker_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
